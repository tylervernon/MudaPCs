  <style>
    body {
      font-family: "Montserrat", sans-serif;
      margin: 0;
      padding: 0;
      background-color: #2f2f2f; /* Dark Gray */
      color: #e0f0ff; /* Light Blue-Gray Text */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    h1 {
      color: #ffffff;
      font-weight: 700;
      margin-bottom: 15px;
    }

    p {
      font-size: 18px;
      color: #c9e4ff; /* Soft Blue-Gray Text */
      line-height: 1.5;
    }

    /* Navigation Bar Full Width */
    nav {
      width: 100vw;
      background-color: #3d5a80; /* Medium Blue */
      padding: 15px 0;
      box-shadow: 0 0 10px #2b3d52cc;
      box-sizing: border-box;
    }

    .nav-container {
      max-width: 1200px; /* content stays centered */
      margin: 0 auto;
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 40px;
      padding: 0 20px;
    }

    .nav-container a {
      color: #dbeeff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    .nav-container a:hover {
      color: #ffffff;
    }

    .logo {
      font-weight: 700;
      font-size: 32px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffffff;
      text-decoration: none;
    }

    /* Main content */
    .content {
      flex-grow: 1;
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    /* Footer Full Width */
    footer {
      width: 100vw;
      background-color: #3d5a80;
      padding: 15px 0;
      color: #e0f0ff;
      text-align: center;
      box-shadow: 0 0 10px #2b3d52cc;
      box-sizing: border-box;
    }

    footer a {
      margin: 0 10px;
      color: #dbeeff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    footer a:hover {
      color: #ffffff;
    }
  </style>
</head>

<body>

  <!-- Navigation Bar -->
  <nav>

      <a href="gamingpcs.html">GamingPcs</a>
      <a href="about.html">About</a>

  </nav>

  <!-- Main Content -->

  <footer>
